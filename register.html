<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Create Account | ArtVault</title>
 <link rel="stylesheet" href="register.css">
</head>
<body>
 <main class="auth-page">
 <a class="brand" href="index.html">ART<span>VAULT</span></a>
 <section class="auth-card">
 <p class="eyebrow">JOIN THE COMMUNITY</p>
 <h1>Create your account</h1>
 <p class="intro">Give your creativity a place to shine.</p>
 <form id="registerForm" novalidate>
 <label for="username">Username</label>
 <input id="username" name="username" type="text"
 minlength="3" maxlength="24" autocomplete="username"
 placeholder="Choose a username" required>
 <label for="email">Email address</label>
 <input id="email" name="email" type="email"
 autocomplete="email" placeholder="you@example.com" required>
 <label for="password">Password</label>
 <input id="password" name="password" type="password"
 minlength="8" autocomplete="new-password"
 placeholder="At least 8 characters" required>
 <label for="confirmPassword">Confirm password</label>
 <input id="confirmPassword" name="confirmPassword" type="password"
 minlength="8" autocomplete="new-password"
 placeholder="Enter your password again" required>
 <p id="formMessage" class="message" role="status" aria-live="polite"></p>
 <button type="submit">CREATE ACCOUNT</button>
 </form>
 <p class="switch">Already have an account?
 <a href="login.html">Log in</a>
 </p>
 <a class="back-link" href="index.html">← Back to welcome page</a>
 </section>
 </main>
 <script src="register.js"></script>
</body>
</html>
