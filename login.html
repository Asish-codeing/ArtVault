<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Log In | ArtVault</title>
 <link rel="stylesheet" href="login.css">
</head>
<body>
 <main class="auth-page">
 <a class="brand" href="index.html">ART<span>VAULT</span></a>
 <section class="auth-card">
 <p class="eyebrow">WELCOME BACK</p>
 <h1>Enter your world</h1>
 <p class="intro">Log in to explore the ArtVault community.</p>
 <form id="loginForm" novalidate>
 <label for="identity">Username or email</label>
 <input id="identity" name="identity" type="text"
 autocomplete="username" placeholder="Your username or email" required>
 <label for="password">Password</label>
 <input id="password" name="password" type="password"
 autocomplete="current-password" placeholder="Your password" required>
 <p id="formMessage" class="message" role="status" aria-live="polite"></p>
 <button type="submit">LOG IN</button>
 </form>
 <p class="switch">New to ArtVault?
 <a href="register.html">Create an account</a>
 </p>
 <a class="back-link" href="index.html">← Back to welcome page</a>
 </section>
 </main>
 <script src="login.js"></script>
</body>
</html>
